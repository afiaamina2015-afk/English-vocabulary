<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Vocabulary Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 10% 20%,rgba(0,255,255,.12),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(138,43,226,.15),transparent 30%),
        linear-gradient(135deg,#050816,#0b1025,#050816);
    overflow-x:hidden;
}

/* Background */
body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    z-index:-1;
}

body::before{
    width:250px;
    height:250px;
    background:#00eaff;
    opacity:.08;
    top:5%;
    left:-80px;
}

body::after{
    width:300px;
    height:300px;
    background:#8b2cff;
    opacity:.09;
    bottom:-100px;
    right:-80px;
}

/* Main */
.container{
    width:min(1200px,94%);
    margin:auto;
    padding:45px 0;
}


.guideline-btn {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 9999;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 11px 16px;

    border: 1px solid rgba(0, 220, 255, 0.45);
    border-radius: 12px;

    background: rgba(20, 35, 65, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.25),
        inset 0 0 15px rgba(0, 200, 255, 0.06);

    transition: all 0.3s ease;
}

.guideline-btn:hover {
    transform: translateY(-2px);

    border-color: rgba(0, 230, 255, 0.9);

    background: linear-gradient(
        135deg,
        rgba(0, 170, 230, 0.9),
        rgba(90, 70, 220, 0.9)
    );

    box-shadow:
        0 10px 30px rgba(0, 190, 255, 0.25),
        0 0 18px rgba(0, 210, 255, 0.18);
}

.guideline-btn:active {
    transform: scale(0.97);
}
.global-back-btn:hover {
    background: rgba(0,234,255,0.2);
    border-color: #00eaff;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,234,255,0.15);
}

/* Header */
.header{
    text-align:center;
    margin-bottom:35px;
}

.header .small-title{
    color:#00eaff;
    font-size:14px;
    font-weight:700;
    letter-spacing:4px;
    margin-bottom:8px;
}

.header h1{
    font-size:clamp(30px,5vw,52px);
    font-weight:800;
    background:linear-gradient(90deg,#fff,#00eaff,#b66cff,#fff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header p{
    color:#aeb8d0;
    margin-top:8px;
    font-size:15px;
}

/* Glass box */
.glass{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.11);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:24px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.06);
}

/* Days */
.days-box{
    padding:28px;
}

.section-title{
    text-align:center;
    font-size:22px;
    margin-bottom:24px;
}

.section-title span{
    color:#00eaff;
}

.days-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

/* Day Card Style */
.day-card{
    position: relative;
    border:1px solid rgba(0,234,255,.2);
    background:rgba(255,255,255,.045);
    border-radius:15px;
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    transition:.25s;
    overflow: hidden;
}

.day-card:hover{
    transform:translateY(-4px);
    border-color:#00eaff;
    background:rgba(0,234,255,.1);
    box-shadow:0 8px 25px rgba(0,234,255,.12);
}

.day-btn{
    border:none;
    background:transparent;
    color:#fff;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    width: 100%;
}

/* Bottom Tick Section */
.card-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 8px;
}

.tick-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 3px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
}

.tick-btn:hover {
    background: #00bcd4;
    border-color: #00bcd4;
}

/* Completed Card State - পুরো বক্সের ওপর DONE ইফেক্ট */
.day-card.completed {
    border-color: #00ffcc;
    background: rgba(0, 255, 204, 0.12);
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
}

/* পুরো বক্সের ওপর বড় করে DONE জলছাপ বা ওভারলে */
.day-card.completed::before {
    content: "DONE";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-size: 28px;
    font-weight: 900;
    color: rgba(0, 255, 204, 0.22);
    letter-spacing: 3px;
    pointer-events: none;
    z-index: 1;
}

.day-card.completed .tick-btn {
    background: #00ffcc;
    border-color: #00ffcc;
    color: #050816;
    font-weight: 700;
}


/* Vocabulary page */
.vocab-page{
    display:none;
}

.vocab-header{
    padding:22px 25px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.vocab-title{
    font-size:25px;
    font-weight:800;
}

.vocab-title span{
    color:#00eaff;
}

.back-btn{
    border:none;
    background:linear-gradient(135deg,#00bcd4,#7c3aed);
    color:#fff;
    padding:11px 20px;
    border-radius:12px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

.back-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,234,255,.18);
}

/* Table */
.table-box{
    padding:10px;
    overflow:hidden;
}

.table-scroll{
    overflow-x:auto;
    border-radius:18px;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
}

thead{
    background:linear-gradient(
        90deg,
        rgba(0,234,255,.18),
        rgba(124,58,237,.18)
    );
}

th{
    padding:17px 14px;
    text-align:left;
    color:#00eaff;
    font-size:14px;
    white-space:nowrap;
}

td{
    padding:16px 14px;
    border-top:1px solid rgba(255,255,255,.07);
    color:#e7ebf7;
    font-size:14px;
    vertical-align:top;
}

tbody tr{
    transition:.2s;
}

tbody tr:hover{
    background:rgba(255,255,255,.045);
}

.number{
    color:#7ddff0;
    font-weight:700;
    width:55px;
}

.word{
    color:#fff;
    font-weight:700;
    font-size:15px;
}

.meaning{
    color:#9eeeff;
}

.pronunciation{
    color:#d2b7ff;
}

.example{
    color:#f2f4fa;
    line-height:1.6;
}

.example-bn{
    color:#aeb8d0;
    line-height:1.6;
}

/* Empty */
.empty{
    text-align:center;
    padding:60px 20px;
    color:#aeb8d0;
}

.empty h2{
    color:#fff;
    margin-bottom:10px;
}

/* Footer */
.footer{
    text-align:center;
    margin-top:30px;
    color:#69738c;
    font-size:12px;
}

/* Responsive */
@media(max-width:900px){
    .days-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){
    .container{
        padding:25px 0;
    }

    .days-box{
        padding:18px;
    }

    .days-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .day-card{
        padding:10px 7px;
    }

    .day-btn{
        font-size:13px;
    }

    .vocab-header{
        flex-direction:column;
        align-items:stretch;
        text-align:center;
    }

    .vocab-title{
        font-size:21px;
    }

    .back-btn{
        width:100%;
    }
}
</style>
</head>

// দিনগুলোর নাম (Ordinal suffixes) ঠিক করার ফাংশন
function getDayName(num) {
    if (num === 1) return "1st Day";
    if (num === 2) return "2nd Day";
    if (num === 3) return "3rd Day";
    if (num === 21) return "21st Day";
    if (num === 22) return "22nd Day";
    if (num === 23) return "23rd Day";
    return num + "th Day";
}

// হোম পেজে কার্ডগুলো ডাইনামিকালি রেন্ডার করা এবং টিক বাটন হ্যান্ডেল করা
function renderDays() {
    const container = document.getElementById("daysGridContainer");
    container.innerHTML = "";

    for (let i = 1; i <= 30; i++) {
        const isCompleted = localStorage.getItem("day_" + i) === "true";
        const dayString = getDayName(i);

        const card = document.createElement("div");
        card.className = `day-card ${isCompleted ? "completed" : ""}`;
        card.id = `dayCard-${i}`;

        card.innerHTML = `
            <button class="day-btn" onclick="showDay(${i})">${dayString}</button>
            <div class="card-bottom">
                <button class="tick-btn" id="tickBtn-${i}" onclick="toggleComplete(event, ${i})">${isCompleted ? '✓ Done' : 'Mark Done'}</button>
            </div>
        `;

        container.appendChild(card);
    }
}

// টিক বাটনে ক্লিক করলে কমপ্লিট স্ট্যাটাস বদলানো
function toggleComplete(event, day) {
    event.stopPropagation(); // যাতে কার্ডে ক্লিক হয়ে ভোকেব্যুলারি পেজে না চলে যায়
    const key = "day_" + day;
    const currentState = localStorage.getItem(key) === "true";
    const newState = !currentState;

    localStorage.setItem(key, newState);

    const card = document.getElementById(`dayCard-${day}`);
    const tickBtn = document.getElementById(`tickBtn-${day}`);

    if (newState) {
        card.classList.add("completed");
        tickBtn.innerText = "✓ Done";
    } else {
        card.classList.remove("completed");
        tickBtn.innerText = "Mark Done";
    }
}

/* Show Day */
function showDay(day){
    document.getElementById("homePage").style.display="none";
    document.getElementById("vocabPage").style.display="block";

    document.getElementById("dayNumber").innerText = "Day " + day;

    const body = document.getElementById("vocabBody");
    body.innerHTML="";

    if(!vocabulary[day]){
        body.innerHTML=`
            <tr>
                <td colspan="6">
                    <div class="empty">
                        <h2>Day ${day}</h2>
                        <p>এই দিনের Vocabulary এখনো যোগ করা হয়নি।</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    vocabulary[day].forEach((item,index)=>{
        const row=document.createElement("tr");
        row.innerHTML=`
            <td class="number">${index+1}</td>
            <td class="word">${item[0]}</td>
            <td class="meaning">${item[1]}</td>
            <td class="pronunciation">${item.length > 2 ? item[2] : ''}</td>
            <td class="example">${item.length > 3 ? item[3] : ''}</td>
            <td class="example-bn">${item.length > 4 ? item[4] : ''}</td>
        `;
        body.appendChild(row);
    });

    window.scrollTo({ top:0, behavior:"smooth" });
}


function openGuideline() {
    window.location.href = "Vocabulary Guidelines.html";
}
